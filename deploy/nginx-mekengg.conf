# ============================================================================
# Nginx Reverse Proxy Configuration for https://mekengg.com
# Place at: /etc/nginx/sites-available/mekengg.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/mekengg.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d mekengg.com -d www.mekengg.com
# ============================================================================

# Canonical redirect: www.mekengg.com -> mekengg.com
server {
    listen 80;
    listen [::]:80;
    server_name www.mekengg.com;
    return 301 https://mekengg.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mekengg.com;

    # Allow up to 64MB for SQLite .db catalog imports and product/banner uploads
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Immutable cache for hashed Next.js static chunks
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Next.js application proxy (PM2 process: mekeng on port 3600)
    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
